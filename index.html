<title>Support Tag Test Site</title>
<!--
  Tag switcher (PLAN.md Phase 4). Must run inline, before the GTM snippet below,
  so the dataLayer already has `activeTags` set by the time GTM's tags evaluate
  their firing triggers. Reads a `?tags=` URL override first, falls back to the
  sticky localStorage choice, defaults to 'all'. Persists the resolved mode back
  to localStorage so it survives navigating to a page without the query param.
  Keep this block byte-identical across index.html / public/errors.html /
  public/api-errors.html — see DEVELOPER.md.
-->
<script>
(function () {
  var STORAGE_KEY = 'supTagTestSite.activeTags';
  var VALID = ['all', 'cs', 'heap', 'hotjar'];
  var fromUrl = new URLSearchParams(window.location.search).get('tags');
  var mode = VALID.indexOf(fromUrl) !== -1 ? fromUrl : null;
  if (!mode) {
    try { mode = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  }
  if (VALID.indexOf(mode) === -1) { mode = 'all'; }
  try { localStorage.setItem(STORAGE_KEY, mode); } catch (e) {}
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ activeTags: mode === 'all' ? ['cs', 'heap', 'hotjar'] : [mode] });
})();
</script>
