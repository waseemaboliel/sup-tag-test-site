<h1>Cart</h1>
<p>Dummy cart used to test Contentsquare ecommerce tracking. See <a href="https://github.com/waseemaboliel/sup-tag-test-site/blob/main/PLAN.md">PLAN.md Phase 1</a> for context.</p>

<table>
  <tr><th>Product</th><th>Price</th><th>Qty</th></tr>
  <tr><td>Test Product A</td><td>$19.99</td><td><input type="number" id="qtyA" value="1" min="0" onchange="recalc()"></td></tr>
  <tr><td>Test Product B</td><td>$9.99</td><td><input type="number" id="qtyB" value="2" min="0" onchange="recalc()"></td></tr>
  <tr><td>Test Product C</td><td>$29.99</td><td><input type="number" id="qtyC" value="1" min="0" onchange="recalc()"></td></tr>
</table>

<p><strong>Cart total:</strong> $<span id="total">69.97</span> (<span id="itemCount">4</span> items)</p>

<button onclick="pushCartDvars()">Push cart dvars (cartValue / cartItemsNb)</button><br>
<a href="checkout.html"><button>Proceed to checkout</button></a>

<div id="log">Update quantities or click a button to see what fired.</div>

<script>
  var prices = { A: 19.99, B: 9.99, C: 29.99 };

  function log(msg) {
    var el = document.getElementById('log');
    el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n' + el.textContent;
  }

  function recalc() {
    var qtyA = Number(document.getElementById('qtyA').value) || 0;
    var qtyB = Number(document.getElementById('qtyB').value) || 0;
    var qtyC = Number(document.getElementById('qtyC').value) || 0;
    var total = (qtyA * prices.A + qtyB * prices.B + qtyC * prices.C).toFixed(2);
    var count = qtyA + qtyB + qtyC;
    document.getElementById('total').textContent = total;
    document.getElementById('itemCount').textContent = count;
    return { total: total, count: count };
  }

  function pushCartDvars() {
    var r = recalc();
    window._uxa = window._uxa || [];
    window._uxa.push(['trackDynamicVariable', { key: 'cartValue', value: Number(r.total) }]);
    window._uxa.push(['trackDynamicVariable', { key: 'cartItemsNb', value: r.count }]);
    log('Pushed dvars: cartValue=' + r.total + ', cartItemsNb=' + r.count);
  }
</script>
