<h1>Fire Events</h1>
<p>Buttons below trigger custom Contentsquare and Heap calls directly, and a raw GTM dataLayer push, for testing.</p>

<button onclick="log('CS dynamic variable set: testDvar = hello-world'); window._uxa=window._uxa||[]; window._uxa.push(['trackDynamicVariable', {key:'testDvar', value:'hello-world'}]);">
  Set Contentsquare dynamic variable
</button>

<button onclick="log('CS manual pageview: events-manual'); window._uxa=window._uxa||[]; window._uxa.push(['trackPageview', 'events-manual']);">
  Track manual Contentsquare pageview
</button>

<button onclick="log('Heap custom event: Test Event'); if (window.heap) { window.heap.track('Test Event', {source: 'sup-tag-test-site'}); } else { log('heap not loaded yet'); }">
  Fire Heap custom event
</button>

<button onclick="log('GTM dataLayer push: test_custom_event'); window.dataLayer=window.dataLayer||[]; window.dataLayer.push({event:'test_custom_event'});">
  Push GTM dataLayer event
</button>

<div id="log">Click a button to see what fired.</div>

<script>
function log(msg) {
  var el = document.getElementById('log');
  el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n' + el.textContent;
}
</script>
